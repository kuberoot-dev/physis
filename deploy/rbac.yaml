# physis needs no access to nodes or pods: work is claimed, not bound (P7).
# The conformance suite checks that these roles grant nothing on nodes.
apiVersion: v1
kind: Namespace
metadata: {name: physis-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: physis-scheduler, namespace: physis-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: physis-agent, namespace: physis-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: physis-scheduler}
rules:
- apiGroups: [physis.kuberoot.dev]
  resources: [problems, problems/status]
  verbs: [get, list, watch, update]
- apiGroups: [physis.kuberoot.dev]
  resources: [substrates, mandates, receipts, links]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [principals]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: physis-agent}
rules:
- apiGroups: [physis.kuberoot.dev]
  resources: [problems, problems/status]
  verbs: [get, list, watch, update]
- apiGroups: [physis.kuberoot.dev]
  resources: [substrates, substrates/status]
  verbs: [get, list, watch, create, update]
- apiGroups: [physis.kuberoot.dev]
  resources: [receipts]
  verbs: [create, get]
# Links decide where an agent's identity endpoint may send data.
- apiGroups: [physis.kuberoot.dev]
  resources: [links]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: physis-scheduler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: physis-scheduler}
subjects: [{kind: ServiceAccount, name: physis-scheduler, namespace: physis-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: physis-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: physis-agent}
subjects: [{kind: ServiceAccount, name: physis-agent, namespace: physis-system}]
---
# Agents keep their signing keys in Secrets of their own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: physis-agent-keys, namespace: physis-system}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: physis-agent-keys, namespace: physis-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: physis-agent-keys}
subjects: [{kind: ServiceAccount, name: physis-agent, namespace: physis-system}]
