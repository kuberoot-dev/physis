<svg xmlns='http://www.w3.org/2000/svg' width='900' height='560' viewBox='0 0 900 560'><rect width='900' height='560' fill='#fcfcfb'/><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><text x='20.0' y='30.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='600'>Объекты нового слоя и путь одной работы</text><text x='20.0' y='52.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>Вместо подов на узлах — запрос результата, план по физике, месту и времени и подписанная квитанция.</text><rect x='20' y='80' width='200' height='104' rx='8' fill='#eb6834' fill-opacity='0.10' stroke='#eb6834' stroke-width='1.5'/><text x='34.0' y='104.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='600'>Mandate</text><text x='34.0' y='126.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='400'>человек поручает агенту:</text><text x='34.0' y='144.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='400'>бюджет, зоны, срок,</text><text x='34.0' y='162.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='400'>уровень автономии</text><rect x='20' y='250' width='200' height='122' rx='8' fill='#2a78d6' fill-opacity='0.10' stroke='#2a78d6' stroke-width='1.5'/><text x='34.0' y='274.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='600'>Problem</text><text x='34.0' y='296.0' font-family='Inter,Helvetica,Arial,sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='400'>запрос результата:</text><text x='34.0' y='314.0' font-